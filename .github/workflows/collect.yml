# Collects tagged reports from the void log channel into reports/<TAG>/.
#
# Needs (Settings > Secrets and variables > Actions):
#   secret   BOT_TOKEN        the bot's token
#   secret   HUB_SALT         long random text (sender tags can't be guessed from usernames)
#   variable VOID_CHANNEL_ID  the void log channel's id
# and Settings > Actions > General > Workflow permissions: "Read and write".
name: Collect reports

on:
  schedule:
    - cron: "17 7 * * *" # daily, 07:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill: re-read from this date (YYYY-MM-DD). Empty = only new messages."
        required: false
      probe:
        description: "Probe: print the log's message layout (masked), store nothing."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: bot
        run: npm install --no-audit --no-fund

      - name: Collect
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HUB_SALT: ${{ secrets.HUB_SALT }}
          VOID_CHANNEL_ID: ${{ vars.VOID_CHANNEL_ID }}
          SINCE: ${{ inputs.since }}
          PROBE: ${{ inputs.probe }}
        run: |
          ARGS=""
          if [ "$PROBE" = "true" ]; then ARGS="--probe"
          elif [ -n "$SINCE" ]; then
            if ! echo "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then echo "since must be YYYY-MM-DD"; exit 1; fi
            ARGS="--since $SINCE"
          fi
          node bot/collect.js $ARGS

      - name: Save
        if: ${{ inputs.probe != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -q -m "Reports [auto]"
            git push -q
          fi
